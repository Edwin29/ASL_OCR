[project]
name = "document-parser"
version = "0.1.0"
description = "Phase 1 document parser tooling for EBS math page assets."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "Pillow",
  "pypdf",
  "pypdfium2",
]

[project.optional-dependencies]
ocr = [
  "paddleocr",
  "paddlepaddle",
]
legacy-ocr = [
  "easyocr",
]

[tool.setuptools.packages.find]
where = ["src"]
