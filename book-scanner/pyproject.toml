[project]
name = "book-scanner"
version = "0.2.0"
description = "Repeated-capture, post-hoc transmittability judgment pipeline feeding document-parser."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "opencv-contrib-python==4.10.0.84",
  "Pillow",
  "requests",
]

[project.optional-dependencies]
hand-detection = [
  "mediapipe==0.10.35",
]

[tool.setuptools.packages.find]
where = ["src"]
