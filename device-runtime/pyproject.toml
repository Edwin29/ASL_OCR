[project]
name = "asl-device-runtime"
version = "0.1.0"
description = "Pure device-flow coordination contracts for ASL OCR."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
laptop = ["pyserial>=3.5,<4"]
audio = ["sounddevice>=0.5,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

