schema_version = 1
connectivity_config = "device-connectivity.e0b.remote.toml"
viewport_size = 10
poll_interval_ms = 20

[delivery]
outbox_db_path = "state/delivery.sqlite3"
artifact_root = "state/artifacts/ready"
upload_timeout_seconds = 60.0
retry_initial_seconds = 1.0
retry_max_seconds = 30.0

[scanner]
profile = "pc_camera"
staging_root = "state/artifacts/staging"
ready_root = "state/artifacts/ready"
uvdoc_runtime_path = "models/uvdoc/runtime"
uvdoc_checkpoint_path = "models/uvdoc/checkpoint.pth"
uvdoc_device = "auto"
m1_model_dir = "models/paddle/page-number"
m1_model_manifest = "models/paddle/page-number-manifest.json"
camera_index = 0
camera_width = 3840
camera_height = 2160
camera_fps = 30.0
sample_interval_ms = 500

[local_io]
controls = "stm_serial"
feedback = "windows_audio"

[local_io.stm_serial]
port = "COM5"
baudrate = 9600
read_timeout_ms = 20
reconnect_initial_ms = 500
reconnect_max_ms = 5000
debounce_ms = 30
cell_count = 10

[local_io.windows_audio]
jsonl_trace = true
speak_catalog_titles = true
queue_capacity = 32
powershell_executable = "powershell.exe"
